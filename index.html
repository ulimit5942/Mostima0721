<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#8ecdf2" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>苹果大作战</title>
<style>
  :root{
    --ink:#173a5e;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    overflow:hidden;
    background:#0b1e33;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",sans-serif;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  body{
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(1200px 800px at 18% 8%,#1d4a76 0%,rgba(29,74,118,0) 60%),
      radial-gradient(1000px 700px at 82% 92%,#173d63 0%,rgba(23,61,99,0) 55%),
      #0b1e33;
  }
  #stage{
    position:relative;
    width:100%;
    max-width:520px;
    height:100vh;height:100dvh;
    overflow:hidden;
    background:#8ecdf2;
    touch-action:none;
  }
  @media (min-width:600px){
    #stage{
      height:min(92dvh,980px);
      border-radius:26px;
      box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08);
    }
  }
  canvas{display:block;}

  /* ================= HUD ================= */
  #hud{
    position:absolute;inset:0;z-index:5;
    padding:calc(var(--safe-top) + 12px) 14px 0;
    display:flex;flex-direction:column;gap:8px;
    pointer-events:none;
    opacity:0;transition:opacity .3s ease;
  }
  .hudRow{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  #hp{display:flex;gap:3px;min-width:96px;padding-top:2px;}
  #hp img{
    width:30px;height:auto;
    filter:drop-shadow(0 2px 2px rgba(20,50,90,.35));
    transition:filter .3s,opacity .3s,transform .3s;
  }
  #hp img.lost{
    filter:grayscale(1) brightness(.5) drop-shadow(0 2px 2px rgba(0,0,0,.25));
    opacity:.32;transform:scale(.82) translateY(2px);
  }
  @keyframes hpShake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-4px)}
    40%{transform:translateX(4px)}
    60%{transform:translateX(-3px)}
    80%{transform:translateX(2px)}
  }
  #hp.shake{animation:hpShake .35s ease;}
  #scoreWrap{flex:1;text-align:center;}
  #score{
    font-size:42px;font-weight:900;line-height:1;color:#fff;
    text-shadow:0 3px 0 #2a5f93,0 6px 14px rgba(20,60,110,.35);
    font-variant-numeric:tabular-nums;
    transition:color .2s,text-shadow .2s;
  }
  #score.boosting{color:#ffe07a;text-shadow:0 3px 0 #b06a12,0 0 18px rgba(255,200,90,.75);}
  #score.bump{animation:bump .22s ease;}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
  #bestLine{
    margin-top:3px;font-size:11px;font-weight:700;color:rgba(255,255,255,.88);
    letter-spacing:.5px;text-shadow:0 1px 3px rgba(20,50,90,.55);
    font-variant-numeric:tabular-nums;
  }
  .hudSpacer{width:96px;}

  #boostWrap{
    display:none;align-items:center;gap:8px;
    width:min(86%,340px);margin:2px auto 0;
    padding:5px 10px 5px 6px;border-radius:999px;
    background:rgba(255,255,255,.22);
    border:1px solid rgba(255,255,255,.45);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    box-shadow:0 4px 14px rgba(255,110,170,.18);
  }
  #boostWrap.on{display:flex;animation:fadeIn .2s ease;}
  #shieldPips{display:flex;gap:3px;padding-left:3px;}
  #shieldPips i{
    width:10px;height:12px;display:block;
    background:linear-gradient(180deg,#e2faff,#5cc8ff 55%,#2f9fe0);
    clip-path:polygon(50% 0%,100% 16%,100% 60%,50% 100%,0% 60%,0% 16%);
    filter:drop-shadow(0 0 4px rgba(120,220,255,.9));
    transition:opacity .2s,transform .2s,filter .2s;
  }
  #shieldPips i.used{opacity:.18;transform:scale(.78);filter:grayscale(1);}
  #boostTag{
    font-size:12px;font-weight:900;color:#fff;
    background:linear-gradient(180deg,#ff9cc7,#ff5f9e);
    padding:3px 8px;border-radius:999px;
    text-shadow:0 1px 0 rgba(160,30,80,.4);
  }
  #boostBar{flex:1;height:8px;border-radius:999px;background:rgba(255,255,255,.35);overflow:hidden;}
  #boostFill{height:100%;width:100%;border-radius:999px;background:linear-gradient(90deg,#ffd86b,#ff8fbc);}
  @keyframes lowFlash{from{opacity:1}to{opacity:.5}}
  #boostWrap.low #boostFill{animation:lowFlash .35s linear infinite alternate;}
  #boostTime{
    min-width:33px;text-align:right;font-size:11px;font-weight:800;color:#fff;
    text-shadow:0 1px 2px rgba(160,30,80,.4);font-variant-numeric:tabular-nums;
  }
  /* ---- 连击条 ---- */
  #comboWrap{
    display:none;align-items:center;gap:8px;
    width:min(86%,340px);margin:2px auto 0;
    padding:5px 12px 5px 6px;border-radius:999px;
    background:rgba(255,255,255,.22);
    border:1px solid rgba(255,255,255,.45);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    box-shadow:0 4px 14px rgba(255,150,60,.16);
  }
  #comboWrap.on{display:flex;animation:fadeIn .2s ease;}
  #comboWrap.bump{animation:comboBump .22s ease;}
  @keyframes comboBump{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
  #comboWrap.break{animation:comboBreak .42s ease;}
  @keyframes comboBreak{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
  #comboTag{
    font-size:11px;font-weight:900;color:#fff;
    background:linear-gradient(180deg,#ffb347,#ff7a1a);
    padding:3px 8px;border-radius:999px;
    text-shadow:0 1px 0 rgba(160,70,0,.4);
  }
  #comboMult{
    min-width:30px;font-size:17px;font-weight:900;line-height:1;color:#fff;
    text-shadow:0 2px 0 #b3540a,0 0 12px rgba(255,170,60,.8);
    font-variant-numeric:tabular-nums;
  }
  #comboWrap.max #comboMult{color:#ffe07a;text-shadow:0 2px 0 #b06a12,0 0 16px rgba(255,220,120,.95);}
  #comboBar{flex:1;height:7px;border-radius:999px;background:rgba(255,255,255,.35);overflow:hidden;}
  #comboFill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#ffd86b,#ff9a3c);transition:width .15s ease;}
  #comboWrap.max #comboFill{background:linear-gradient(90deg,#ffe9a0,#ffbf4d);box-shadow:0 0 8px rgba(255,220,120,.9);}
  #comboCount{
    min-width:32px;text-align:right;font-size:11px;font-weight:800;color:#fff;
    text-shadow:0 1px 2px rgba(160,70,0,.45);font-variant-numeric:tabular-nums;
  }
  #comboWrap.break #comboMult,#comboWrap.break #comboCount{color:#ffb4b4;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  #topBtns{
    position:absolute;top:calc(var(--safe-top) + 12px);right:14px;z-index:30;
    display:flex;gap:6px;
  }
  .iconBtn{
    width:34px;height:34px;border-radius:50%;
    border:1.5px solid rgba(255,255,255,.72);
    background:rgba(255,255,255,.28);
    color:#fff;display:grid;place-items:center;padding:0;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    box-shadow:0 2px 8px rgba(20,50,90,.18);
    cursor:pointer;transition:transform .08s,background .15s;
  }
  .iconBtn:active{transform:scale(.9);background:rgba(255,255,255,.48);}
  .iconBtn svg{width:17px;height:17px;}

  /* ================= 触摸提示 ================= */
  #touchHint{
    position:absolute;left:0;right:0;bottom:calc(var(--safe-bottom) + 18px);
    z-index:6;display:flex;justify-content:space-between;padding:0 22px;
    pointer-events:none;opacity:0;transition:opacity .5s ease;
  }
  #touchHint.on{opacity:1;}
  .hintSide{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    color:#fff;text-shadow:0 2px 6px rgba(20,50,90,.55);
  }
  .hintSide svg{width:26px;height:26px;opacity:.85;transition:transform .12s,opacity .12s,filter .12s;}
  .hintSide small{font-size:11px;font-weight:700;letter-spacing:1px;opacity:.85;}
  .hintSide.active svg{transform:scale(1.28);opacity:1;filter:drop-shadow(0 0 8px rgba(255,255,255,.85));}

  /* ================= 全屏界面 ================= */
  .screen{
    position:absolute;inset:0;z-index:10;
    display:flex;flex-direction:column;
    padding:calc(var(--safe-top) + 26px) 22px calc(var(--safe-bottom) + 24px);
    background:linear-gradient(180deg,rgba(12,40,72,.62) 0%,rgba(12,40,72,.22) 38%,rgba(12,40,72,.10) 55%,rgba(12,40,72,.50) 100%);
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .28s ease,visibility .28s ease;
    overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;
  }
  .screen.show{opacity:1;visibility:visible;pointer-events:auto;}
  #screen-over,#screen-pause{
    background:rgba(10,35,65,.56);
    justify-content:center;align-items:center;
  }

  /* ---------- 标题页 ---------- */
  #screen-title{justify-content:flex-start;}
  .titleWrap{margin-top:2vh;text-align:center;animation:floatIn .6s cubic-bezier(.2,.9,.3,1.2);}
  @keyframes floatIn{from{opacity:0;transform:translateY(-18px) scale(.96)}to{opacity:1;transform:none}}
  .gameTitle{
    font-size:clamp(34px,10.4vw,52px);
    font-weight:900;letter-spacing:2.5px;line-height:1.12;color:#fff;
    text-shadow:
      2px 0 0 #2b5d8f,-2px 0 0 #2b5d8f,0 2px 0 #2b5d8f,0 -2px 0 #2b5d8f,
      1.6px 1.6px 0 #2b5d8f,-1.6px 1.6px 0 #2b5d8f,1.6px -1.6px 0 #2b5d8f,-1.6px -1.6px 0 #2b5d8f,
      0 5px 0 #2b5d8f,0 14px 24px rgba(10,40,80,.45);
  }
  .subtitle{
    margin-top:10px;font-size:14px;font-weight:700;color:#eaf6ff;
    letter-spacing:2px;text-shadow:0 2px 8px rgba(10,40,80,.65);
  }
  .legend{
    width:100%;max-width:360px;margin:3vh auto 0;
    padding:14px 16px;border-radius:20px;
    background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.35);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    box-shadow:0 10px 30px rgba(10,40,80,.18);
    display:flex;flex-direction:column;gap:10px;
  }
  .legendRow{display:flex;align-items:center;gap:10px;text-align:left;}
  .legendRow img{width:38px;height:38px;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(20,50,90,.25));}
  .legendText{font-size:12.5px;line-height:1.35;color:#f2f9ff;text-shadow:0 1px 3px rgba(10,40,80,.5);}
  .legendText b{font-size:13.5px;color:#fff;}
  .titleBottom{margin-top:auto;margin-bottom:3vh;display:flex;flex-direction:column;align-items:center;gap:11px;}
  .btn{
    appearance:none;border:2px solid #fff;border-radius:999px;
    padding:15px 46px;font-size:20px;font-weight:900;letter-spacing:2px;
    color:#5a3200;background:linear-gradient(180deg,#ffe08a 0%,#ffc042 55%,#ffab1f 100%);
    box-shadow:0 6px 0 #d98b12,0 12px 24px rgba(180,100,0,.28);
    cursor:pointer;font-family:inherit;
    transition:transform .08s,box-shadow .08s,filter .2s;
  }
  .btn:hover{filter:brightness(1.05);}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #d98b12,0 6px 14px rgba(180,100,0,.22);}
  .btn.ghost{
    background:rgba(255,255,255,.18);color:#fff;
    border-color:rgba(255,255,255,.65);
    box-shadow:0 4px 0 rgba(20,60,110,.35);
  }
  .btn.ghost:active{box-shadow:0 1px 0 rgba(20,60,110,.35);}
  .card .btn.ghost{
    color:#3f6a94;
    background:rgba(255,255,255,.62);
    border-color:rgba(90,140,190,.38);
    box-shadow:0 4px 0 rgba(90,140,190,.22);
  }
  .card .btn.ghost:active{box-shadow:0 1px 0 rgba(90,140,190,.22);}
  .bestLine{font-size:13px;font-weight:700;color:rgba(255,255,255,.92);text-shadow:0 2px 6px rgba(10,40,80,.5);}
  .bestLine b{color:#ffe07a;}
  .hintLine{font-size:11.5px;color:rgba(255,255,255,.78);letter-spacing:.4px;text-align:center;}
  .desktopHint{display:none;}
  @media (min-width:700px) and (pointer:fine){
    .desktopHint{display:block;}
  }

  /* ---------- 结算 / 暂停 ---------- */
  .card{
    width:100%;max-width:340px;text-align:center;
    background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(232,244,255,.96));
    border-radius:26px;padding:26px 22px 22px;
    box-shadow:0 24px 60px rgba(5,25,50,.45),inset 0 1px 0 #fff;
    animation:cardIn .35s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
  .overTitle{font-size:26px;font-weight:900;color:#1d4a78;letter-spacing:2px;}
  .overReason{margin-top:4px;font-size:12.5px;font-weight:600;color:#7a8fa6;}
  .finalScore{
    margin-top:12px;font-size:56px;font-weight:900;color:#e8453c;line-height:1;
    font-variant-numeric:tabular-nums;text-shadow:0 3px 0 rgba(200,60,50,.15);
  }
  .finalLabel{margin-top:4px;font-size:11px;font-weight:700;color:#8ba0b5;letter-spacing:2px;}
  .newRecord{
    display:none;margin-top:7px;padding:5px 14px;border-radius:999px;
    font-size:13px;font-weight:900;color:#fff;
    background:linear-gradient(90deg,#ff9a3c,#ff5f9e);
    animation:pop .4s ease;
  }
  .newRecord.on{display:inline-block;}
  @keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
  .overBest{margin-top:10px;font-size:13px;font-weight:700;color:#4a6b8a;}
  .card .btn{margin-top:16px;width:100%;padding:13px 20px;font-size:17px;}
  .card .btn.ghost{margin-top:10px;}

  /* ================= 加载 / 旋转提示 ================= */
  #loading{
    position:absolute;inset:0;z-index:50;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:linear-gradient(180deg,#8ecdf2,#d6efff);
    color:#1d4a78;font-size:14px;font-weight:700;letter-spacing:1px;
    transition:opacity .3s ease;
  }
  #loading.hide{opacity:0;pointer-events:none;}
  .loader{
    width:38px;height:38px;border-radius:50%;
    border:4px solid rgba(29,74,120,.18);border-top-color:#1d4a78;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #rotate{
    position:fixed;inset:0;z-index:100;display:none;place-items:center;
    background:#0d2238;color:#fff;font-size:16px;font-weight:700;letter-spacing:1px;
  }
  @media (orientation:landscape) and (max-height:560px) and (pointer:coarse){
    #rotate{display:grid;}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <!-- ================= HUD ================= -->
  <div id="hud">
    <div class="hudRow">
      <div id="hp"></div>
      <div id="scoreWrap">
        <div id="score">0</div>
        <div id="bestLine">最高 0</div>
      </div>
      <div class="hudSpacer"></div>
    </div>
    <div id="boostWrap">
      <div id="shieldPips"><i></i></div>
      <div id="boostTag">×2</div>
      <div id="boostBar"><div id="boostFill"></div></div>
      <div id="boostTime">7.0s</div>
    </div>
    <div id="comboWrap">
      <div id="comboTag">连击</div>
      <div id="comboMult">×1</div>
      <div id="comboBar"><div id="comboFill"></div></div>
      <div id="comboCount">0 连</div>
    </div>
  </div>

  <div id="topBtns">
    <button class="iconBtn" id="soundBtn" aria-label="静音">
      <svg id="soundOnIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      <svg id="soundOffIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M11 5 6 9H2v6h4l5 4V5z"/><line x1="16" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="16" y2="15"/></svg>
    </button>
    <button class="iconBtn" id="pauseBtn" aria-label="暂停">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1.5"/><rect x="14" y="4" width="4" height="16" rx="1.5"/></svg>
    </button>
  </div>

  <div id="touchHint">
    <div class="hintSide" id="hintL">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      <small>左移</small>
    </div>
    <div class="hintSide" id="hintR">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      <small>右移</small>
    </div>
  </div>

  <!-- ================= 标题页 ================= -->
  <div id="screen-title" class="screen">
    <div class="titleWrap">
      <div class="gameTitle">苹果大作战</div>
      <div class="subtitle">接住苹果 · 躲开炸弹 · 挑战高分</div>
    </div>
    <div class="legend">
      <div class="legendRow"><img data-img="apple_red" alt=""><div class="legendText"><b>红苹果</b><br>最常见，+1 分 · 连击每 10 个升一档，最高 ×4</div></div>
      <div class="legendRow"><img data-img="apple_bomb" alt=""><div class="legendText"><b>炸弹苹果</b><br>碰到会损失 1 点生命</div></div>
      <div class="legendRow"><img data-img="apple_pink" alt=""><div class="legendText"><b>粉色苹果</b><br>稀有，7 秒内得分翻倍并获得 1 层护盾</div></div>
      <div class="legendRow"><img data-img="apple_blue" alt=""><div class="legendText"><b>蓝色苹果</b><br>最稀有，碰到直接结束游戏</div></div>
    </div>
    <div class="titleBottom">
      <button class="btn" id="startBtn">开始游戏</button>
      <div class="bestLine">最高分 <b id="titleBest">0</b></div>
      <div class="hintLine">按住屏幕左半边向左移动 · 右半边向右移动</div>
      <div class="hintLine desktopHint">电脑可用 ← → 或 A / D 键移动</div>
    </div>
  </div>

  <!-- ================= 结算页 ================= -->
  <div id="screen-over" class="screen">
    <div class="card">
      <div class="overTitle">游戏结束</div>
      <div class="overReason" id="overReason">生命耗尽</div>
      <div class="finalScore" id="finalScore">0</div>
      <div class="finalLabel">本局得分</div>
      <div class="newRecord" id="newRecord">新纪录！</div>
      <div class="overBest" id="overBest">最高分 0</div>
      <button class="btn" id="retryBtn">再来一局</button>
      <button class="btn ghost" id="homeBtn">回到首页</button>
    </div>
  </div>

  <!-- ================= 暂停页 ================= -->
  <div id="screen-pause" class="screen">
    <div class="card">
      <div class="overTitle">暂停中</div>
      <div class="overReason">休息一下，苹果不会跑掉</div>
      <button class="btn" id="resumeBtn">继续游戏</button>
      <button class="btn ghost" id="restartBtn">重新开始</button>
      <button class="btn ghost" id="pauseHomeBtn">回到首页</button>
    </div>
  </div>

  <div id="loading">
    <div class="loader"></div>
    <div id="loadingText">正在加载…</div>
  </div>
  <div id="rotate">请将手机竖过来游玩</div>
</div>

<script>
(() => {
  'use strict';

  /* =========================================================
     常量
     ========================================================= */
  const DIFF_TIME   = 140;   // 难度爬满所需秒数（难度上限）
  const MAX_APPLES  = 14;    // 同屏苹果上限
  const BOOST_TIME  = 7;     // 粉色苹果双倍时间
  const HIT_TIME    = 0.7;   // 受击表情持续时间
  const KEY_BEST    = 'appleBattle.best.v1';
  const KEY_MUTE    = 'appleBattle.mute.v1';

  /* =========================================================

  /* =========================================================
     工具
     ========================================================= */
  const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
  const rand  = (a, b) => a + Math.random() * (b - a);
  function diff() {
    const t = clamp(S.time / DIFF_TIME, 0, 1);
    return t * t * (3 - 2 * t);          // smoothstep，平滑爬升并封顶
  }

  /* =========================================================
     音频（WebAudio 合成，无外部音频文件）
     ========================================================= */
  let actx = null, master = null;
  function initAudio() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        actx = new AC();
        master = actx.createGain();
        master.gain.value = 0.32;
        master.connect(actx.destination);
      } catch (e) { actx = null; }
    }
    if (actx && actx.state === 'suspended') actx.resume();
  }
  function tone(freq, dur, type, vol, slideTo, delay) {
    if (!actx || muted) return;
    const t0 = actx.currentTime + (delay || 0);
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.3, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function noise(dur, vol) {
    if (!actx || muted) return;
    const t0 = actx.currentTime;
    const len = Math.max(1, Math.floor(actx.sampleRate * dur));
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = actx.createBufferSource();
    src.buffer = buf;
    const g = actx.createGain();
    g.gain.value = vol;
    const f = actx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 900;
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t0);
  }
  function sfx(name) {
    if (!actx || muted) return;
    switch (name) {
      case 'catch': tone(720, 0.09, 'sine', 0.2, 980); break;
      case 'boost': [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.12, 'triangle', 0.17, f * 1.01, i * 0.07)); break;
      case 'bomb': noise(0.32, 0.32); tone(120, 0.35, 'sawtooth', 0.22, 45); break;
      case 'shield': tone(880, 0.12, 'sine', 0.16, 1320); break;
      case 'tier': [784, 1047, 1319].forEach((f, i) => tone(f, 0.11, 'triangle', 0.18, f, i * 0.06)); break;
      case 'break': tone(330, 0.18, 'square', 0.08, 180); break;
      case 'gameover': [392, 330, 262, 196].forEach((f, i) => tone(f, 0.28, 'triangle', 0.2, f * 0.98, i * 0.14)); break;
      case 'start': [523, 659, 784].forEach((f, i) => tone(f, 0.1, 'sine', 0.17, f, i * 0.06)); break;
      case 'click': tone(520, 0.06, 'sine', 0.1, 620); break;
    }
  }
  function vibrate(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
  function updateSoundIcon() {
    soundOnIcon.style.display = muted ? 'none' : 'block';
    soundOffIcon.style.display = muted ? 'block' : 'none';
    soundBtn.setAttribute('aria-label', muted ? '开启声音' : '静音');
  }
  function toggleMute() {
    muted = !muted;
    try { localStorage.setItem(KEY_MUTE, muted ? '1' : '0'); } catch (e) {}
    updateSoundIcon();
    if (!muted) { initAudio(); sfx('click'); }
  }

  /* =========================================================
     画布尺寸 & 背景
     ========================================================= */
  let W = 0, H = 0, DPR = 1, groundY = 0, charW = 0, charH = 0, bgCanvas = null;

  function resize() {
    const rect = stage.getBoundingClientRect();
    W = Math.max(1, rect.width);
    H = Math.max(1, rect.height);
    DPR = Math.min(2, window.devicePixelRatio || 1);
    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.imageSmoothingEnabled = true;

    groundY = H * 0.875;
    charH = clamp(Math.min(H * 0.245, W * 0.52), 110, 260);
    charW = charH * (IMG.char_idle ? IMG.char_idle.width / IMG.char_idle.height : 0.7344);
    S.player.y = groundY;
    if (S.player.x === 0) S.player.x = W / 2;
    S.player.x = clamp(S.player.x, charW * 0.47, W - charW * 0.47);
    buildBg();
  }

  function buildBg() {
    if (!IMG.bg) return;
    bgCanvas = document.createElement('canvas');
    bgCanvas.width  = Math.round(W * DPR);
    bgCanvas.height = Math.round(H * DPR);
    const c = bgCanvas.getContext('2d');
    c.setTransform(DPR, 0, 0, DPR, 0, 0);

    const im = IMG.bg;
    const scale = Math.max(W / im.width, H / im.height);
    const dw = im.width * scale, dh = im.height * scale;
    c.drawImage(im, (W - dw) / 2, (H - dh) / 2, dw, dh);

    // 顶部压暗，保证 HUD 可读
    let g = c.createLinearGradient(0, 0, 0, H * 0.28);
    g.addColorStop(0, 'rgba(18,48,88,0.42)');
    g.addColorStop(1, 'rgba(18,48,88,0)');
    c.fillStyle = g; c.fillRect(0, 0, W, H * 0.28);

    // 底部提亮，让深色角色与地面分离
    g = c.createLinearGradient(0, H * 0.60, 0, H);
    g.addColorStop(0, 'rgba(240,250,255,0)');
    g.addColorStop(0.55, 'rgba(238,249,255,0.34)');
    g.addColorStop(1, 'rgba(214,240,255,0.56)');
    c.fillStyle = g; c.fillRect(0, H * 0.60, W, H * 0.40);

    // 轻微暗角
    g = c.createRadialGradient(W / 2, H * 0.46, Math.min(W, H) * 0.34, W / 2, H * 0.46, Math.max(W, H) * 0.78);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(8,28,58,0.20)');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
  }

  let lastScore = -1;
  function updateScoreUI() {
    if (S.score === lastScore) return;
    lastScore = S.score;
    scoreEl.textContent = S.score;
    scoreEl.classList.remove('bump');
    void scoreEl.offsetWidth;
    scoreEl.classList.add('bump');
    bestEl.textContent = '最高 ' + Math.max(S.best, S.score);
  }
  function updateHpUI() {
    hpImgs.forEach((img, i) => img.classList.toggle('lost', i >= S.hp));
  }
  function updateBoostUI() {
    const on = S.boostT > 0;
    boostWrap.classList.toggle('on', on);
    boostWrap.classList.toggle('low', on && S.boostT < 3);
    scoreEl.classList.toggle('boosting', on);
    shieldPips.forEach((el, i) => el.classList.toggle('used', i >= S.shield));
    if (on) {
      boostFill.style.width = (S.boostT / BOOST_TIME * 100) + '%';
      boostTimeEl.textContent = S.boostT.toFixed(1) + 's';
    }
  }
  function syncHud() {
    hud.style.opacity = (S.mode === 'playing' || S.mode === 'paused' || S.mode === 'over') ? '1' : '0';
    pauseBtn.style.display = (S.mode === 'playing') ? 'grid' : 'none';
  }
  /* ---------- 连击 ---------- */
  // 每 10 个红苹果升一档：×2 → ×4（上限）；红苹果落地或扣血 → 回到 ×1
  const COMBO_STEP = 10;
  function comboMultFor(n) { return n >= COMBO_STEP * 2 ? 4 : (n >= COMBO_STEP ? 2 : 1); }
  function updateComboUI(bump) {
    const on = S.combo > 0 && S.mode === 'playing';
    comboWrap.classList.toggle('on', on);
    comboWrap.classList.toggle('max', S.comboMult >= 4);
    if (on) {
      comboMultEl.textContent = '×' + S.comboMult;
      const base = S.comboMult >= 4 ? COMBO_STEP * 2 : (S.comboMult === 2 ? COMBO_STEP : 0);
      const prog = S.comboMult >= 4 ? 1 : clamp((S.combo - base) / COMBO_STEP, 0, 1);
      comboFill.style.width = (prog * 100) + '%';
      comboCountEl.textContent = S.comboMult >= 4 ? 'MAX' : (S.combo + ' 连');
    }
    if (bump && on) {
      comboWrap.classList.remove('bump'); void comboWrap.offsetWidth; comboWrap.classList.add('bump');
    }
  }
  function addCombo() {
    S.combo++;
    const m = comboMultFor(S.combo);
    const tierUp = m > S.comboMult;
    S.comboMult = m;
    if (tierUp) {
      popup(S.player.x, S.player.y - charH * 1.12, '连击 ×' + m, '#ffb347', true);
      ring(S.player.x, S.player.y - charH * 0.5, 'rgba(255,180,80,0.9)', 76);
      burst(S.player.x, S.player.y - charH * 0.55, '#ffd27a', 14, 220);
      sfx('tier');
      vibrate(20);
    }
    updateComboUI(true);
  }
  function breakCombo(x, y) {
    if (S.combo === 0) { updateComboUI(false); return; }
    S.combo = 0; S.comboMult = 1;
    comboMultEl.textContent = '×1';
    comboCountEl.textContent = '0 连';
    comboFill.style.width = '0%';
    comboWrap.classList.remove('bump'); void comboWrap.offsetWidth; comboWrap.classList.add('break');
    popup(x, y, '连击中断', '#ffb4b4', true);
    sfx('break');
    setTimeout(() => { comboWrap.classList.remove('break'); updateComboUI(false); }, 430);
  }
  function showScreen(name) {
    Object.keys(screens).forEach(k => screens[k].classList.toggle('show', k === name));
  }
  function hideScreens() {
    Object.keys(screens).forEach(k => screens[k].classList.remove('show'));
  }
  function showHint() { hintEl.classList.add('on'); }
  function hideHint() { hintEl.classList.remove('on'); }

  let lastL = null, lastR = null;
  function syncHintActive() {
    if (S.pointer.left !== lastL) { hintL.classList.toggle('active', S.pointer.left); lastL = S.pointer.left; }
    if (S.pointer.right !== lastR) { hintR.classList.toggle('active', S.pointer.right); lastR = S.pointer.right; }
  }

  /* =========================================================
     生成苹果
     ========================================================= */
  function pickType() {
    if (S.spawnCount < 2) return 'red';                    // 开局两个一定是红苹果
    const t = S.time, d = diff();
    if (t > 18 && t - S.lastBlue > 16 && Math.random() < 0.012 + 0.010 * d) {
      S.lastBlue = t; return 'blue';
    }
    if (t - S.lastPink > 12 && Math.random() < 0.028 + 0.007 * d) {
      S.lastPink = t; return 'pink';
    }
    if (Math.random() < 0.10 + 0.05 * d) return 'bomb';
    return 'red';
  }

  function spawnApple(type, decor) {
    const d = decor ? 0 : diff();
    const base = clamp(W * 0.175, 52, 96) * (1 - 0.26 * d) * (decor ? 0.72 : 1);
    const size = base * rand(0.86, 1.14);
    const im = IMG['apple_' + type];
    const h = size * (im.height / im.width);
    const margin = size * 0.55;
    let x = rand(margin, W - margin);

    // 蓝色苹果不贴着玩家头顶生成，留出躲避空间
    if (type === 'blue' && !decor) {
      const px = S.player.x;
      const minDist = W * 0.14;
      if (Math.abs(x - px) < minDist) {
        const left = px - W * 0.20;
        const right = px + W * 0.20;
        const leftOk = left > margin;
        const rightOk = right < W - margin;
        if (leftOk && (!rightOk || px > W / 2)) x = left;
        else if (rightOk) x = right;
        x = clamp(x, margin, W - margin);
      }
    }

    const speedBase = H * (0.30 + 0.30 * d);
    const a = {
      type, x, y: -h * 0.6, w: size, h,
      vy: decor ? H * 0.075 : speedBase * rand(0.92, 1.08),
      phase: rand(0, Math.PI * 2),
      swayAmp: rand(5, 16),
      swayFreq: rand(1.1, 2.1),
      rot: 0, t: 0
    };
    (decor ? S.decor : S.apples).push(a);
  }

  /* =========================================================
     更新
     ========================================================= */
  function update(dt) {
    S.time += dt;
    updatePlayer(dt);
    updateSpawn(dt);
    updateApples(dt);
    updateFx(dt);
    updateTimers(dt);
  }

  function updatePlayer(dt) {
    const dir = (S.pointer.right ? 1 : 0) - (S.pointer.left ? 1 : 0);
    const maxV = W * 1.18;
    const target = dir * maxV;
    const k = 1 - Math.exp(-dt * (dir === 0 ? 12 : 16));
    S.player.vx += (target - S.player.vx) * k;
    S.player.x += S.player.vx * dt;

    const half = charW * 0.47;
    if (S.player.x < half) { S.player.x = half; S.player.vx = Math.max(0, S.player.vx); }
    if (S.player.x > W - half) { S.player.x = W - half; S.player.vx = Math.min(0, S.player.vx); }

    const targetTilt = (S.player.vx / maxV) * 0.07;
    S.player.tilt += (targetTilt - S.player.tilt) * (1 - Math.exp(-dt * 10));
  }

  function updateSpawn(dt) {
    S.spawnT -= dt;
    if (S.spawnT <= 0 && S.apples.length < MAX_APPLES) {
      spawnApple(pickType(), false);
      const d = diff();
      S.spawnT = (1.0 - 0.60 * d) * rand(0.78, 1.22);
      S.spawnCount++;
    }
  }

  function hitPlayer(a) {
    const p = S.player;
    const top = p.y - charH * 0.94;
    const bottom = p.y - charH * 0.03;
    const halfW = charW * 0.43;
    const r = Math.min(a.w, a.h) * 0.38;
    return a.x + r > p.x - halfW && a.x - r < p.x + halfW &&
           a.y + r > top && a.y - r < bottom;
  }

  function updateApples(dt) {
    for (let i = S.apples.length - 1; i >= 0; i--) {
      const a = S.apples[i];
      a.t += dt;
      a.y += a.vy * dt;
      a.x += Math.cos(a.t * a.swayFreq + a.phase) * a.swayAmp * dt;
      a.rot = Math.sin(a.t * 1.7 + a.phase) * 0.13;

      const m = a.w * 0.5;
      if (a.x < m) a.x = m;
      if (a.x > W - m) a.x = W - m;

      if (a.y > groundY - a.h * 0.12) {
        splat(a);
        if (a.type === 'red' && S.combo > 0) breakCombo(a.x, groundY - a.h * 0.9);   // 红苹果落地 → 连击清零
        S.apples.splice(i, 1);
        continue;
      }
      if (hitPlayer(a)) {
        S.apples.splice(i, 1);
        onCatch(a);
        if (S.mode !== 'playing') return;
      }
    }
  }

  function splat(a) {
    for (let i = 0; i < 5; i++) {
      S.particles.push({
        x: a.x + rand(-6, 6), y: groundY - 2,
        vx: rand(-55, 55), vy: rand(-130, -30),
        life: rand(0.3, 0.5), max: 0.5, size: rand(1.5, 3.5),
        color: 'rgba(255,255,255,0.85)', g: 520
      });
    }
  }

  function onCatch(a) {
    const boosting = S.boostT > 0;
    if (a.type === 'red') {
      addCombo();                                   // 先累计连击，再按新倍率计分
      const pts = (boosting ? 2 : 1) * S.comboMult;
      S.score += pts;
      popup(a.x, a.y, '+' + pts, S.comboMult > 1 ? '#ffd27a' : '#ffffff');
      burst(a.x, a.y, S.comboMult > 1 ? '#ffc85a' : '#ff6b5e', 10, 190);
      ring(a.x, a.y, 'rgba(255,255,255,0.9)', 40);
      sfx('catch');
    } else if (a.type === 'pink') {
      const pts = (boosting ? 4 : 2) * S.comboMult;   // 连击倍率与双倍得分叠加
      S.score += pts;
      S.boostT = BOOST_TIME;
      S.shield = 1;                       // 1 层护盾
      updateBoostUI();
      popup(a.x, a.y, '×2 + 护盾！', '#ffd1e6', true);
      burst(a.x, a.y, '#ff9ec4', 18, 230);
      burst(a.x, a.y, '#fff3b0', 12, 200);
      ring(a.x, a.y, 'rgba(255,170,210,0.95)', 64);
      sfx('boost');
      vibrate(30);
    } else if (a.type === 'bomb') {
      if (S.shield > 0) {
        absorbShield(a);
      } else {
        S.hp--;
        S.hitT = HIT_TIME;
        S.shake = Math.max(S.shake, 14);
        S.flash = 0.55;
        breakCombo(S.player.x, S.player.y - charH * 1.12);   // 扣血 → 连击清零
        popup(a.x, a.y, '-1 生命', '#ff5a4e', true);
        burst(a.x, a.y, '#ff7a3c', 22, 260);
        burst(a.x, a.y, '#3a3a3a', 10, 200);
        ring(a.x, a.y, 'rgba(255,110,70,0.9)', 60);
        sfx('bomb');
        vibrate(70);
        updateHpUI();
        hpEl.classList.remove('shake'); void hpEl.offsetWidth; hpEl.classList.add('shake');
        if (S.hp <= 0) endGame('hp');
      }
    } else if (a.type === 'blue') {
      if (S.shield > 0) {
        absorbShield(a);
      } else {
        S.hitT = HIT_TIME;
        S.shake = 24;
        S.flash = 1;
        popup(a.x, a.y, '蓝色苹果！', '#7f9cff', true);
        burst(a.x, a.y, '#5b7cff', 30, 300);
        burst(a.x, a.y, '#ffffff', 16, 240);
        ring(a.x, a.y, 'rgba(120,145,255,0.95)', 90);
        sfx('gameover');
        vibrate([40, 40, 120]);
        endGame('blue');
      }
    }
    updateScoreUI();
  }

  function absorbShield(a) {
    S.shield = Math.max(0, S.shield - 1);
    S.cyanFlash = 0.4;
    S.shake = Math.max(S.shake, 8);
    popup(a.x, a.y, '护盾 -1', '#bff0ff', true);
    burst(a.x, a.y, '#9be8ff', 16, 240);
    ring(a.x, a.y, 'rgba(155,232,255,0.95)', 62);
    sfx('shield');
    vibrate(30);
    updateBoostUI();
  }

  function updateTimers(dt) {
    if (S.boostT > 0) {
      S.boostT = Math.max(0, S.boostT - dt);
      if (Math.random() < dt * 20) spawnSpark();
      updateBoostUI();
      if (S.boostT === 0) {
        S.shield = 0;
        updateBoostUI();
        popup(S.player.x, S.player.y - charH * 0.95, '强化结束', '#ffffff');
      }
    }
    if (S.hitT > 0) S.hitT = Math.max(0, S.hitT - dt);
    if (S.hintT > 0) {
      S.hintT -= dt;
      if (S.hintT <= 0) hideHint();
    }
  }

  /* =========================================================
     特效
     ========================================================= */
  function popup(x, y, text, color, big) {
    S.popups.push({ x, y, text, color, big: !!big, life: 1.1, max: 1.1 });
  }
  function burst(x, y, color, n, speed) {
    for (let i = 0; i < n; i++) {
      const ang = rand(0, Math.PI * 2);
      const sp = rand((speed || 220) * 0.25, speed || 220);
      S.particles.push({
        x, y,
        vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 40,
        life: rand(0.45, 0.85), max: 0.85,
        size: rand(2, 4.5), color, g: 480
      });
    }
  }
  function ring(x, y, color, maxR) {
    S.rings.push({ x, y, r: 8, maxR: maxR || 50, life: 0.35, maxLife: 0.35, color });
  }
  function spawnSpark() {
    const p = S.player;
    S.particles.push({
      x: p.x + rand(-charW * 0.55, charW * 0.55),
      y: p.y - rand(0, charH * 1.02),
      vx: rand(-15, 15), vy: rand(-80, -28),
      life: rand(0.5, 0.9), max: 0.9,
      size: rand(1.5, 3.5),
      color: Math.random() < 0.5 ? '#ffd1e6' : '#fff3b0',
      g: -20
    });
  }
  function updateFx(dt) {
    for (let i = S.particles.length - 1; i >= 0; i--) {
      const p = S.particles[i];
      p.life -= dt;
      if (p.life <= 0) { S.particles.splice(i, 1); continue; }
      p.vy += (p.g == null ? 520 : p.g) * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
    for (let i = S.rings.length - 1; i >= 0; i--) {
      const r = S.rings[i];
      r.life -= dt;
      r.r += (r.maxR - r.r) * (1 - Math.exp(-dt * 18));
      if (r.life <= 0) S.rings.splice(i, 1);
    }
    for (let i = S.popups.length - 1; i >= 0; i--) {
      const p = S.popups[i];
      p.life -= dt;
      p.y -= 46 * dt;
      if (p.life <= 0) S.popups.splice(i, 1);
    }
    // 屏震 / 红闪 / 青闪在所有模式下都衰减（结算页、首页也不会残留）
    S.shake = Math.max(0, S.shake - dt * 45);
    S.flash = Math.max(0, S.flash - dt * 2.4);
    S.cyanFlash = Math.max(0, S.cyanFlash - dt * 2.2);
  }

  /* =========================================================
     绘制
     ========================================================= */
  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (bgCanvas) ctx.drawImage(bgCanvas, 0, 0, W, H);

    ctx.save();
    if (S.shake > 0.2) ctx.translate(rand(-S.shake, S.shake), rand(-S.shake, S.shake));

    if (S.mode === 'title') {
      ctx.globalAlpha = 0.5;
      for (const a of S.decor) drawApple(a);
      ctx.globalAlpha = 1;
    } else {
      for (const a of S.apples) drawAppleShadow(a);
      drawPlayerShadow();
      if (S.mode !== 'loading') drawPlayer();
      for (const a of S.apples) drawApple(a);
    }

    drawRings();
    drawParticles();
    drawPopups();
    ctx.restore();

    if (S.flash > 0.01) {
      ctx.fillStyle = 'rgba(255,70,60,' + (S.flash * 0.32) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    if (S.cyanFlash > 0.01) {
      ctx.fillStyle = 'rgba(90,215,255,' + (S.cyanFlash * 0.22) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    syncHintActive();
  }

  function drawAppleShadow(a) {
    const hFrac = clamp(a.y / groundY, 0, 1);
    const alpha = 0.04 + 0.15 * hFrac;
    const rw = a.w * 0.5 * (0.34 + 0.34 * hFrac);
    ctx.fillStyle = 'rgba(26,54,92,' + alpha + ')';
    ctx.beginPath();
    ctx.ellipse(a.x, groundY + 2, rw, rw * 0.26, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawPlayerShadow() {
    ctx.save();
    ctx.globalAlpha = 0.20;
    ctx.fillStyle = '#173a5e';
    ctx.beginPath();
    ctx.ellipse(S.player.x, groundY + 3, charW * 0.30, charH * 0.035, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawApple(a) {
    const im = IMG['apple_' + a.type];
    if (!im) return;
    ctx.save();
    ctx.translate(a.x, a.y);

    if (a.type === 'blue' || a.type === 'pink' || a.type === 'bomb') {
      const t = performance.now() / 1000;
      const pulse = 0.5 + 0.5 * Math.sin(t * 4 + a.phase);
      const r = a.w * (a.type === 'blue' ? 0.95 : 0.82);
      const col = a.type === 'blue' ? '96,116,255' : (a.type === 'pink' ? '255,150,200' : '255,110,70');
      const g = ctx.createRadialGradient(0, 0, a.w * 0.18, 0, 0, r);
      g.addColorStop(0, 'rgba(' + col + ',' + (0.10 + 0.13 * pulse) + ')');
      g.addColorStop(1, 'rgba(' + col + ',0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    }

    ctx.rotate(a.rot);
    ctx.drawImage(im, -a.w / 2, -a.h / 2, a.w, a.h);
    ctx.restore();
  }

  function drawPlayer() {
    const p = S.player;
    let im = IMG.char_idle;
    if (S.hitT > 0) im = IMG.char_hit;
    else if (S.boostT > 0) im = IMG.char_boost;
    if (!im) return;

    if (S.boostT > 0) {
      const t = performance.now() / 1000;
      const pulse = 1 + Math.sin(t * 6) * 0.08;
      const cx = p.x, cy = p.y - charH * 0.48;
      const r = charW * 0.98 * pulse;
      const g = ctx.createRadialGradient(cx, cy, charW * 0.08, cx, cy, r);
      g.addColorStop(0, 'rgba(255,195,228,0.55)');
      g.addColorStop(0.55, 'rgba(255,140,195,0.22)');
      g.addColorStop(1, 'rgba(255,140,195,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    }

    if (S.shield > 0) {
      const t = performance.now() / 1000;
      const pulse = 1 + Math.sin(t * 5) * 0.035;
      const cx = p.x, cy = p.y - charH * 0.46;
      const r = charW * 0.74 * pulse;
      const g = ctx.createRadialGradient(cx, cy, r * 0.5, cx, cy, r);
      g.addColorStop(0, 'rgba(120,220,255,0)');
      g.addColorStop(0.72, 'rgba(120,220,255,0.08)');
      g.addColorStop(1, 'rgba(120,220,255,0.26)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(165,240,255,0.8)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
      const pipY = cy - r - 9;
      for (let i = 0; i < S.shield; i++) {
        const px = cx + (i - (S.shield - 1) / 2) * 15;
        ctx.fillStyle = '#d8f7ff';
        ctx.strokeStyle = 'rgba(60,170,230,0.95)';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(px, pipY, 4.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      }
    }

    let sx = 0, sy = 0;
    if (S.hitT > 0) {
      const k = S.hitT / HIT_TIME;
      sx = rand(-3, 3) * k;
      sy = rand(-2, 2) * k;
    }

    ctx.save();
    ctx.translate(p.x + sx, p.y + sy);
    ctx.rotate(p.tilt);
    ctx.drawImage(im, -charW / 2, -charH, charW, charH);
    ctx.restore();
  }

  function drawParticles() {
    for (const p of S.particles) {
      const a = clamp(p.life / p.max, 0, 1);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (0.5 + 0.5 * a), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawRings() {
    for (const r of S.rings) {
      const a = clamp(r.life / r.maxLife, 0, 1);
      ctx.globalAlpha = a * 0.8;
      ctx.strokeStyle = r.color;
      ctx.lineWidth = 1 + 3 * a;
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawPopups() {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const p of S.popups) {
      const a = clamp(p.life / p.max, 0, 1);
      ctx.globalAlpha = a;
      ctx.font = '900 ' + (p.big ? 24 : 19) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(20,50,90,0.55)';
      ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
  }

  /* =========================================================
     标题页装饰
     ========================================================= */
  function seedDecor() {
    S.decor.length = 0;
    const types = ['red', 'pink', 'bomb', 'blue', 'red'];
    for (let i = 0; i < types.length; i++) {
      spawnApple(types[i], true);
      const a = S.decor[S.decor.length - 1];
      a.y = rand(H * 0.28, H * 0.74);
      a.t = rand(0, 4);
    }
  }

  function updateTitle(dt) {
    S.time += dt;
    S.decorT -= dt;
    if (S.decorT <= 0 && S.decor.length < 8) {
      const r = Math.random();
      const type = r < 0.58 ? 'red' : (r < 0.80 ? 'pink' : (r < 0.93 ? 'bomb' : 'blue'));
      spawnApple(type, true);
      S.decorT = rand(0.7, 1.3);
    }
    for (let i = S.decor.length - 1; i >= 0; i--) {
      const a = S.decor[i];
      a.t += dt;
      a.y += a.vy * dt;
      a.x += Math.cos(a.t * a.swayFreq + a.phase) * a.swayAmp * dt;
      a.rot = Math.sin(a.t * 1.4 + a.phase) * 0.12;
      if (a.y > H + a.h) S.decor.splice(i, 1);
    }
    updateFx(dt);
  }

  /* =========================================================
     流程
     ========================================================= */
  function startGame() {
    initAudio();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    S.mode = 'playing';
    S.score = 0; S.hp = 3; S.time = 0;
    S.spawnT = 0.6; S.spawnCount = 0;
    S.apples.length = 0; S.decor.length = 0;
    S.particles.length = 0; S.rings.length = 0; S.popups.length = 0;
    S.shake = 0; S.flash = 0; S.boostT = 0; S.shield = 0; S.cyanFlash = 0; S.hitT = 0;
    S.combo = 0; S.comboMult = 1;
    S.lastPink = -99; S.lastBlue = -99;
    S.isNewBest = false; S.overReason = '';
    S.player.x = W / 2; S.player.vx = 0; S.player.tilt = 0; S.player.y = groundY;
    S.hintT = 3.4;
    lastScore = -1;
    pointers.clear(); updatePointers();
    updateHpUI(); updateScoreUI(); updateBoostUI(); updateComboUI(false);
    hideScreens(); syncHud(); showHint();
    sfx('start');
  }

  function endGame(reason) {
    if (S.mode !== 'playing') return;
    S.mode = 'over';
    S.overReason = reason;
    S.isNewBest = S.score > S.best;
    updateComboUI(false);
    if (S.isNewBest) {
      S.best = S.score;
      try { localStorage.setItem(KEY_BEST, String(S.best)); } catch (e) {}
    }
    syncHud();
    setTimeout(() => {
      if (S.mode !== 'over') return;
      $('#finalScore').textContent = S.score;
      $('#overBest').textContent = '最高分 ' + S.best;
      $('#overReason').textContent = reason === 'blue' ? '碰到了蓝色苹果' : '生命耗尽';
      $('#newRecord').classList.toggle('on', S.isNewBest);
      showScreen('over');
    }, 750);
  }

  function pauseGame() {
    if (S.mode !== 'playing') return;
    S.mode = 'paused';
    pointers.clear(); updatePointers();
    S.pointer.left = false; S.pointer.right = false;
    syncHud();
    showScreen('pause');
    sfx('click');
  }

  function resumeGame() {
    if (S.mode !== 'paused') return;
    S.mode = 'playing';
    hideScreens();
    syncHud();
    lastTs = 0;
    sfx('click');
  }

  function goHome() {
    S.mode = 'title';
    S.apples.length = 0;
    S.particles.length = 0; S.rings.length = 0; S.popups.length = 0;
    S.score = 0; S.hp = 3; S.boostT = 0; S.shield = 0; S.cyanFlash = 0; S.hitT = 0; S.time = 0;
    S.shake = 0; S.flash = 0;            // 清掉死亡时的红闪与持续震动
    S.combo = 0; S.comboMult = 1;
    S.decorT = 0.8;
    S.player.x = W / 2; S.player.vx = 0; S.player.tilt = 0;
    lastScore = -1;
    updateHpUI(); updateScoreUI(); updateBoostUI(); updateComboUI(false);
    hideScreens(); syncHud(); hideHint();
    seedDecor();
    $('#titleBest').textContent = S.best;
    showScreen('title');
    sfx('click');
  }

  /* =========================================================
     主循环
     ========================================================= */
  let lastTs = 0;
  function loop(ts) {
    requestAnimationFrame(loop);
    if (!lastTs) { lastTs = ts; return; }
    let dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if (dt > 0.05) dt = 0.05;

    if (S.mode === 'playing') update(dt);
    else if (S.mode === 'title') updateTitle(dt);
    else if (S.mode === 'over') updateFx(dt);

    draw();
  }

  /* =========================================================
     输入
     ========================================================= */
  const pointers = new Map();
  function updatePointers() {
    S.pointer.left = false; S.pointer.right = false;
    pointers.forEach(side => {
      if (side === 'L') S.pointer.left = true; else S.pointer.right = true;
    });
  }
  canvas.addEventListener('pointerdown', (e) => {
    if (S.mode !== 'playing') return;
    initAudio();
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const side = x < rect.width / 2 ? 'L' : 'R';
    pointers.set(e.pointerId, side);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    updatePointers();
    e.preventDefault();
  });
  function releasePointer(e) {
    pointers.delete(e.pointerId);
    updatePointers();
  }
  canvas.addEventListener('pointerup', releasePointer);
  canvas.addEventListener('pointercancel', releasePointer);
  canvas.addEventListener('lostpointercapture', releasePointer);
  stage.addEventListener('contextmenu', (e) => e.preventDefault());

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') S.pointer.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') S.pointer.right = true;
    if (e.code === 'Space') {
      if (S.mode === 'title' || S.mode === 'over') { e.preventDefault(); startGame(); }
      else if (S.mode === 'paused') { e.preventDefault(); resumeGame(); }
    }
    if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
      if (S.mode === 'playing') pauseGame();
      else if (S.mode === 'paused') resumeGame();
    }
    if (e.key === 'm' || e.key === 'M') toggleMute();
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') S.pointer.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') S.pointer.right = false;
  });

  $('#startBtn').addEventListener('click', startGame);
  $('#retryBtn').addEventListener('click', startGame);
  $('#restartBtn').addEventListener('click', startGame);
  $('#homeBtn').addEventListener('click', goHome);
  $('#pauseHomeBtn').addEventListener('click', goHome);
  $('#resumeBtn').addEventListener('click', resumeGame);
  pauseBtn.addEventListener('click', pauseGame);
  soundBtn.addEventListener('click', toggleMute);

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && S.mode === 'playing') pauseGame();
  });

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 220));

  /* =========================================================
     启动
     ========================================================= */
  function loadAll() {
    const keys = Object.keys(SRC);
    return Promise.all(keys.map(k => new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => { IMG[k] = im; res(); };
      im.onerror = () => rej(new Error('load fail: ' + k));
      im.src = SRC[k];
    })));
  }

  loadAll().then(() => {
    document.querySelectorAll('[data-img]').forEach(el => {
      const key = el.getAttribute('data-img');
      if (SRC[key]) el.src = SRC[key];
    });
    updateSoundIcon();
    resize();
    S.mode = 'title';
    syncHud();
    $('#titleBest').textContent = S.best;
    updateScoreUI();
    seedDecor();
    showScreen('title');
    const loading = $('#loading');
    loading.classList.add('hide');
    setTimeout(() => loading.remove(), 400);
    requestAnimationFrame(loop);
  }).catch((err) => {
    console.error(err);
    $('#loadingText').textContent = '资源加载失败，请刷新页面';
  });

  // 调试入口（本地测试用）
  window.__appleGame = { S, startGame, endGame, spawnApple, pickType, onCatch, diff, updateTimers, updateBoostUI, updateApples };
})();
</script>
</body>
</html>
